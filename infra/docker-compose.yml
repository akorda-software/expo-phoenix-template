services:
  mobile:
    image: node:24.19.0-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && sleep infinity"
    volumes:
      - ..:/workspace
    profiles: ["mobile"]

  backend:
    image: hexpm/elixir:1.20.4-erlang-29.1.1-debian-bookworm-20260918-slim
    working_dir: /workspace/apps/backend
    command: sh -lc "mix local.hex --force && mix local.rebar --force && sleep infinity"
    environment:
      MIX_ENV: dev
      DATABASE_URL: ecto://postgres:postgres@postgres/your_app_dev
    volumes:
      - ..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["backend"]

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: your_app_dev
    ports:
      - "127.0.0.1:${EXPO_POSTGRES_HOST_PORT:-5500}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d your_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
