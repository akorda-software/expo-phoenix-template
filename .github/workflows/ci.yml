name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    name: Mobile & contracts checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:mobile
      - run: pnpm --dir apps/mobile exec expo install --check
      - run: pnpm --dir apps/mobile exec expo export --platform all
      - run: pnpm --dir apps/mobile exec expo prebuild --no-install
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: your_app_test
        ports: ['5500:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: |
            apps/backend/deps
            apps/backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('apps/backend/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix test
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: prod
